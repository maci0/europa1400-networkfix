version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [deps, ci]
  - package-ecosystem: docker
    directory: /harness
    schedule:
      interval: monthly
    labels: [deps, harness]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: monthly
    labels: [deps, vendor]
