name: Build Europa1400 Network Stability Plugin
on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about 3 minutes. The headroom is for the apt install
    # below, which fetches wine+wine32+xvfb and has taken over 12 minutes on a
    # slow mirror, cancelling the v0.4.0 tag build at the old 15-minute cap.
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The runner image's clang-format floats between major versions, which
      # reflow differently; pin it so lint means the same thing here and
      # locally. Version must match Makefile:CLANG_FORMAT_VERSION_EXPECTED.
      - name: Set up clang-format 22.1.8
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Lint (clang-format)
        env:
          CLANG_FORMAT: uvx clang-format@22.1.8
        run: make lint

      # shellcheck and cppcheck are pinned for the same reason as clang-format:
      # apt versions renumber and retune checks between releases, so an
      # unpinned gate means something different here than locally. shellcheck
      # comes from its upstream release (checksummed), cppcheck from the
      # cppcheck-wheel PyPI package since it publishes no binary release.
      # Versions must match Makefile:{SHELLCHECK,CPPCHECK}_VERSION_EXPECTED.
      - name: Static analysis (cppcheck + shellcheck)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          CPPCHECK: uvx --from cppcheck==1.5.1 cppcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          make analyze

      - name: Cache Zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.zig
          key: zig-0.16.0-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-

      - name: Set up Zig 0.16.0
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          if [ -x "$HOME/.zig/zig" ]; then
            echo "Zig cache hit"
          else
            curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
            echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check --strict
            mkdir -p "$HOME/.zig"
            tar -xJf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          fi
          echo "$HOME/.zig" >> "$GITHUB_PATH"
          "$HOME/.zig/zig" version

      - name: Build ASI (release)
        run: |
          make clean
          make all
          ls -lh bin/ 2>&1 | head -n 20

      - name: Verify ASI
        run: |
          test -f bin/networkfix.asi
          ls -lh bin/networkfix.asi
          sha256sum bin/networkfix.asi
          file bin/networkfix.asi

      - name: Package distribution (zip + SBOM + checksums)
        run: |
          make dist
          ls -lh dist/

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32 xvfb

      # xvfb-run owns the server lifecycle. Backgrounding `Xvfb :99 &` raced
      # `make test` (wine could reach DISPLAY before the server listened) and
      # left an orphan holding the step's stdout open.
      - name: Run integration tests
        env:
          WINEDEBUG: '-all'
        run: xvfb-run --auto-servernum make test

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            bin/networkfix.asi
            dist/networkfix-*.zip
            dist/networkfix-*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release (latest, rolling on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: false
          make_latest: false
          generate_release_notes: false
          files: |
            bin/networkfix.asi
            dist/networkfix-*.zip
            dist/networkfix-*.sha256

      - name: Publish versioned release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bin/networkfix.asi
            dist/networkfix-*.zip
            dist/networkfix-*.sha256
          generate_release_notes: true
          make_latest: true

      - name: Attest build provenance (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/networkfix.asi
